const ES=[
["List the problems of keeping data in file systems. How does a database system solve them?","1) Data redundancy and inconsistency (same data in many files and formats).\n2) Difficulty accessing data (a new program for each new task).\n3) Data isolation (many files and formats).\n4) Integrity problems (constraints buried in program code, hard to change).\n5) Atomicity of updates (failures leave partial updates, e.g. money transfer).\n6) Concurrent access by many users (can give wrong results, e.g. two withdrawals).\n7) Security problems (hard to give access to some data only).\nA database system gives solutions to all of them."],
["Explain the three levels of data abstraction.","Physical level: how a record is stored (files, indexes). Lowest level.\nLogical level: what data is stored and the relationships (tables, attributes, constraints). Users do not care about storage.\nView level: highest level, closest to users. Each user sees a customized view of the same database.\nPurpose: hide complexity from users."],
["What is the difference between schema and instance? What is physical data independence?","Schema = the overall structure of the database (like the type of a variable). Logical schema and physical schema.\nInstance = the actual data at one moment (like the value of a variable).\nPhysical data independence = change the physical schema without changing the logical schema. Applications depend only on the logical schema, so no redesign is needed when storage changes."],
["Explain the database languages: DDL, DML, DCL, TCL, DQL with examples.","DDL: defines the structure. CREATE, ALTER, DROP, TRUNCATE, COMMENT, RENAME. Output goes to the data dictionary (metadata).\nDML: insert, update, delete data. INSERT, UPDATE, DELETE, MERGE, CALL. Called the query language when used for retrieval.\nDCL: access rights. GRANT, REVOKE.\nTCL: transactions. COMMIT, ROLLBACK, SAVEPOINT.\nDQL: retrieve data without changing it. SELECT."],
["Compare procedural and declarative DML. Why is SQL not enough alone to build an application?","Procedural: user says what data is needed AND how to get it.\nDeclarative (non-procedural): user says only what is needed. Easier to learn. SQL is declarative.\nSQL is not Turing-equivalent. It cannot take user input, show output or use the network. So it is embedded in a host language (C/C++, Java, Python). SQL manages data, the language manages logic and interaction."],
["Describe the database engine: storage manager, query processor and transaction manager.","Storage manager: interface between low-level data and programs. Parts: authorization and integrity manager, transaction manager, file manager, buffer manager. Structures: data files, data dictionary, indices.\nQuery processor: DDL interpreter, DML compiler (translates and optimizes to the lowest-cost plan), query evaluation engine. Steps: parsing and translation, optimization, evaluation.\nTransaction management: keeps the database consistent after failures; the concurrency-control manager controls concurrent transactions."],
["Compare two-tier and three-tier architecture. Name database architectures.","Two-tier: the application runs at the client and calls the database system on the server.\nThree-tier: the client is only a front end with no direct database calls. It talks to an application server, which talks to the database.\nArchitectures: centralized (client-server), parallel (shared memory, shared disk, shared nothing), distributed (geographic distribution)."],
["What does the DBA do?","Central control of the system: schema definition; storage structure and access-method definition; schema and physical organization changes; granting authorization; routine maintenance: backups, enough free disk space, monitoring jobs."],
["Define data, DBMS, database. Give examples of relational and NoSQL DBMS and of data models.","Database system = interrelated data + programs to access it, in a convenient and efficient environment. DBMS = software to create, update, retrieve and secure data. Relational stores tables; NoSQL stores key-value pairs.\nRelational: MySQL, Oracle, SQL Server, PostgreSQL, Snowflake. NoSQL: MongoDB, Cassandra, DynamoDB, Redis.\nData models: relational, entity-relationship (design), object-based, semi-structured (XML); older: network, hierarchical."],
["What is a data model? Name the models and explain the relational model.","A data model is a collection of conceptual tools to describe data, data relationships, data semantics and consistency constraints.\nModels: relational, entity-relationship (mainly for design), object-based (object-oriented and object-relational), semi-structured (XML). Older: network, hierarchical.\nRelational model: all data is stored in tables (columns = attributes, rows = tuples). Ted Codd defined it (Turing Award 1981)."],
["What is the data dictionary and metadata? What do the DDL commands do?","Metadata = data about data. The data dictionary stores it: schema definitions, constraints, table properties. It is the output of the DDL compiler and is kept by the DBMS.\nDDL: CREATE (database and objects: table, index, view, procedure, function, trigger), ALTER (change structure), DROP (delete objects), TRUNCATE (remove all records), COMMENT, RENAME.\nDDL also specifies integrity constraints (primary key, foreign key, unique, not null, check) and authorization."],
["List database applications and the purpose of database systems.","Applications: sales, accounting, HR, manufacturing, banking and finance, credit cards, universities (registration, grades), airlines, telecom, online retail and ads, document databases, navigation systems.\nPurpose: a database system manages data that is valuable, large and used by many users at the same time. It solves the file-system problems (redundancy, access, isolation, integrity, atomicity, concurrency, security)."],
["Explain the three tasks of query processing and the role of the transaction manager. Why do we need transactions?","Query processing: 1) parsing and translation, 2) optimization (DML compiler picks the lowest-cost plan), 3) evaluation (query evaluation engine runs the plan).\nA transaction is a group of operations that does one logical function (e.g. a transfer). The transaction manager keeps the database consistent after power or OS failures, and the concurrency-control manager controls concurrent transactions. This gives atomicity."],
["Summarize the history of database systems.","1950s-60s: magnetic tapes, sequential access, punched cards.\nLate 1960s-70s: hard disks, network and hierarchical models; Codd defines the relational model; System R (IBM), Ingres (Berkeley), first Oracle.\n1980s: relational systems become commercial; SQL becomes the standard; parallel, distributed and object-oriented databases.\n1990s: data mining, data warehouses, web commerce.\n2000s: big data, NoSQL, MapReduce. 2010s: SQL reloaded, massively parallel and main-memory databases."]
];

const REF=`<h3>Lecture 1: Intro</h3><ul><li>DBMS = interrelated data + programs. Relational = tables; NoSQL = key-value.</li><li>File system problems: redundancy, hard access, isolation, integrity, atomicity, concurrency, security.</li><li>Levels: physical, logical, view. Schema = structure; instance = content. Physical data independence.</li><li>DDL (CREATE ALTER DROP TRUNCATE), DML (INSERT UPDATE DELETE MERGE), DCL (GRANT REVOKE), TCL (COMMIT ROLLBACK SAVEPOINT), DQL (SELECT).</li><li>Engine: storage manager, query processor (parse, optimize, evaluate), transaction manager. 2-tier vs 3-tier. DBA tasks.</li></ul>
<h3>Lecture 2: Relational model and algebra</h3><ul><li>Relation = table; tuple = row; attribute = column. Cardinality = rows; degree = columns. NULL = unknown.</li><li>Superkey, candidate key (minimal), primary key, foreign key.</li><li>Six basic operators: σ select (rows), π project (columns, removes duplicates), ∪ union, − difference, × Cartesian product, ρ rename. Also ∩, ⋈ join = σ(r×s), ← assignment.</li><li>Union, intersection and difference need same arity and compatible domains. |r×s| = m×n.</li></ul>
<h3>Lecture 3: SQL basics</h3><ul><li>Types: char, varchar, int, numeric(p,d), float.</li><li>create table with primary key, foreign key, not null. insert, delete, drop table, alter table add/drop.</li><li>select = π, from = ×, where = σ. distinct, *, as, arithmetic, self join with aliases, LIKE (% and _), order by (asc default).</li></ul>
<h3>Lecture 4: SQL advanced</h3><ul><li>between; tuple comparison; union / intersect / except (remove duplicates; ALL keeps them).</li><li>NULL: use is null; comparisons give unknown; where treats unknown as false.</li><li>avg min max sum count; group by (select attributes must be in group by); having after groups, where before.</li><li>Subqueries: in / not in, some, all. (= some) = in; (&lt;&gt; all) = not in.</li><li>exists / not exists test for a non-empty / empty subquery. Correlated subquery uses the outer alias. X − Y = empty means X is inside Y (for 'all courses').</li><li>unique is true if the subquery has no duplicate rows (also true when empty). Assignment: average salary per department, same department as Einstein, number of courses per student.</li></ul>
<h3>Sections 1 and 2</h3><ul><li>Sec 1: database vs data vs information vs knowledge; SQL vs NoSQL; DDL, DML, DQL, DCL, TCL examples; primary and foreign keys; create COURSE and SECTION.</li><li>Sec 2: relational algebra operators, composition, equivalent queries, Assignment 1 (Q7 sample query returns departments with 2 or more employees).</li></ul>`;
